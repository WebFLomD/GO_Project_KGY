{{define "content"}}
    <h1>Редактировать расходы</h1>
    <form action="/edit" method="POST">

        <input type="hidden" name="id" value="{{.Expense.ID}}">

        <label>Название:</label>
        <input type="text" name="description" value="{{.Expense.Description}}">

        <label>Цена:</label>
        <input type="number" name="amount" value="{{.Expense.Amount}}">

        <label>Дата расхода:</label>
        <input type="date" name="date" value="{{.Expense.Date}}" required>

        <label>Категория:</label>
        <select name="category_id">
            {{range .Categories}}
                <option value="{{.ID}}" {{if eq .ID $.Expense.CategoryID}}selected{{end}}>
                    {{.Name}}
                </option>
            {{end}}
        </select>

        <button type="submit">Сохранить изменение</button>
    </form>

    <a href="/">Назад</a>
{{end}}
